<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minimal Shader Background Example</title>
	<!-- Google Fonts -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap">

	<link rel="stylesheet" href="src/styles.css">
	<style>
		body {
			display: grid;
			place-items: center;
		}

		.content {
			mix-blend-mode: difference;
		}
	</style>

	<!-- Buffer pass: processes feedback and draws the blob -->
	<script type="x-shader/x-fragment" id="blob-buffer">
		precision highp float;

		uniform vec2 iResolution;
		uniform float iMinDimension;
		uniform sampler2D iChannel0;
		uniform float iFeedbackFadeRate;
		uniform vec2 iBlobCenter;
		uniform float iBlobRadius;
		uniform vec3 iBlobColor;
		uniform float iBlobIntensity;

		void main() {
			vec2 uv = gl_FragCoord.xy / iResolution;
			vec2 st = (gl_FragCoord.xy * 2.0 - iResolution) / iMinDimension;

			vec3 previousColor = texture2D(iChannel0, uv).rgb;
			previousColor *= iFeedbackFadeRate;

			float dist = distance(iBlobCenter, st);
			float blob = smoothstep(iBlobRadius, iBlobRadius * 0.7, dist);
			blob = pow(blob, 15.0);

			vec3 drawColor = iBlobColor * blob * iBlobIntensity;

			vec3 color = clamp(previousColor + drawColor, 0.0, 1.0);
			gl_FragColor = vec4(color, 1.0);
		}
	</script>

	<!-- Image pass: outputs the buffer to screen -->
	<script type="x-shader/x-fragment" id="blob-image">
		precision highp float;

		uniform vec2 iResolution;
		uniform sampler2D iChannel0;

		void main() {
			gl_FragColor = texture2D(iChannel0, gl_FragCoord.xy / iResolution);
		}
	</script>
</head>

<body>
	<!-- Page content -->
	<main class="content">
		<h1>Interactive Blob Background</h1>
		<p>Move your mouse or touch and drag to control the blob.</p>
		<p>This is a minimal example showing only what's needed for shader integration.</p>
	</main>

	<!-- WebGL unsupported notification -->
	<div id="webgl-notification" class="webgl-notification hidden">
		⚠️ Shader cannot be played on this device
	</div>

	<!-- Shader library by xemantic (must load before shader initialization script) -->
	<script src="src/shader-web-background.min.js"></script>

	<!-- Shader code -->
	<script>
		(function () {
			// Shader state
			var minDimension = Math.min(window.innerWidth, window.innerHeight);
			var mouseX = window.innerWidth / 2;
			var mouseY = window.innerHeight / 2;
			var shaderMouseX = 0;
			var shaderMouseY = 0;

			// Blob parameters
			var blobCenterX = 0;
			var blobCenterY = 0;
			var blobColor = [1, 0.5, 0.8];
			var blobRadius = 0.25;
			var blobIntensity = 0.6;
			var feedbackFadeRate = 0.98;
			var colorShiftSpeed = 0.1;

			// Mouse and touch tracking
			document.addEventListener('mousemove', function (e) {
				mouseX = e.clientX;
				mouseY = e.clientY;
			});

			document.addEventListener('touchmove', function (e) {
				if (e.touches.length > 0) {
					mouseX = e.touches[0].clientX;
					mouseY = e.touches[0].clientY;
				}
			}, { passive: true });

			// Check WebGL support
			function checkWebGLSupport() {
				try {
					const canvas = document.createElement('canvas');
					const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
					return !!gl;
				} catch (e) {
					return false;
				}
			}

			// Show WebGL unsupported notification
			function showWebGLNotification() {
				const notification = document.getElementById('webgl-notification');
				if (notification) {
					notification.classList.remove('hidden');
				}
			}

			// Hide WebGL unsupported notification
			function hideWebGLNotification() {
				const notification = document.getElementById('webgl-notification');
				if (notification) {
					notification.classList.add('hidden');
				}
			}

			// Check WebGL support before initializing
			if (!checkWebGLSupport()) {
				showWebGLNotification();
			} else {
				// Initialize shader
				try {
					shaderWebBackground.shade({
						onInit: function (ctx) {
							mouseX = ctx.cssWidth / 2;
							mouseY = ctx.cssHeight / 2;
						},
						onResize: function (width, height) {
							minDimension = Math.min(width, height);
						},
						onBeforeFrame: function (ctx) {
							var time = performance.now() / 1000;

							// Convert mouse to shader coordinates
							shaderMouseX = ctx.toShaderX(mouseX);
							shaderMouseY = ctx.toShaderY(mouseY);

							// Normalized coordinates
							var stMouseX = (2 * shaderMouseX - ctx.width) / minDimension;
							var stMouseY = (2 * shaderMouseY - ctx.height) / minDimension;

							var targetX = stMouseX;
							var targetY = stMouseY;

							// Smooth blob movement
							blobCenterX += (targetX - blobCenterX) * 0.15;
							blobCenterY += (targetY - blobCenterY) * 0.15;

							// Color shifts based on position and time
							var distance = Math.sqrt(blobCenterX * blobCenterX + blobCenterY * blobCenterY);
							var hue = (time * colorShiftSpeed + distance * 0.5) % 1.0;
							blobColor[0] = 0.5 + 0.5 * Math.sin(hue * Math.PI * 2);
							blobColor[1] = 0.5 + 0.5 * Math.sin((hue + 0.33) * Math.PI * 2);
							blobColor[2] = 0.5 + 0.5 * Math.sin((hue + 0.66) * Math.PI * 2);
						},
						shaders: {
							'blob-buffer': {
								uniforms: {
									iResolution: function (gl, loc, ctx) { gl.uniform2f(loc, ctx.width, ctx.height); },
									iMinDimension: function (gl, loc) { gl.uniform1f(loc, minDimension); },
									iFeedbackFadeRate: function (gl, loc) { gl.uniform1f(loc, feedbackFadeRate); },
									iBlobCenter: function (gl, loc) { gl.uniform2f(loc, blobCenterX, blobCenterY); },
									iBlobRadius: function (gl, loc) { gl.uniform1f(loc, blobRadius); },
									iBlobColor: function (gl, loc) { gl.uniform3f(loc, blobColor[0], blobColor[1], blobColor[2]); },
									iBlobIntensity: function (gl, loc) { gl.uniform1f(loc, blobIntensity); },
									iChannel0: function (gl, loc, ctx) { ctx.texture(loc, ctx.buffers['blob-buffer']); }
								}
							},
							'blob-image': {
								uniforms: {
									iResolution: function (gl, loc, ctx) { gl.uniform2f(loc, ctx.width, ctx.height); },
									iChannel0: function (gl, loc, ctx) { ctx.texture(loc, ctx.buffers['blob-buffer']); }
								}
							}
						}
					});
				} catch (error) {
					console.error('Failed to initialize shader:', error);
					showWebGLNotification();
				}
			}
		})();
	</script>

</body>

</html>
